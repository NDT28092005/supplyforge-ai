version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
  pre_build:
    commands:
      - cd frontend && npm ci
  build:
    commands:
      - cd frontend && npm run build
      - aws s3 sync frontend/dist/frontend/ "s3://${FRONTEND_BUCKET}/" --delete --exclude "index.html" --cache-control "public,max-age=31536000,immutable"
      - aws s3 cp frontend/dist/frontend/index.html "s3://${FRONTEND_BUCKET}/index.html" --cache-control "no-cache,no-store,must-revalidate" --content-type "text/html"
      - aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
