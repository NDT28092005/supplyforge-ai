global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alertmanager@supplyforge.ai'
  smtp_auth_username: 'alertmanager'
  smtp_auth_password: 'password'
  smtp_require_tls: true

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  receiver: 'default-email'
  group_by: ['environment', 'alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # Production P1 Critical Route
    - matchers:
        - environment="production"
        - severity="P1"
      receiver: 'production-critical-email'
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 1h

    # Production P2 & P3 Standard Route
    - matchers:
        - environment="production"
        - severity=~"P2|P3"
      receiver: 'production-standard-email'
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

    # Staging Isolation Route
    - matchers:
        - environment="staging"
      receiver: 'staging-email'
      group_wait: 1m
      group_interval: 10m
      repeat_interval: 12h

receivers:
  - name: 'default-email'
    email_configs:
      - to: 'ops@supplyforge.ai'
        send_resolved: true
        html: '{{ template "email.default.html" . }}'
        headers:
          subject: '{{ template "email.default.subject" . }}'

  - name: 'production-critical-email'
    email_configs:
      - to: 'oncall@supplyforge.ai'
        send_resolved: true
        html: '{{ template "email.default.html" . }}'
        headers:
          subject: '{{ template "email.default.subject" . }}'

  - name: 'production-standard-email'
    email_configs:
      - to: 'ops@supplyforge.ai'
        send_resolved: true
        html: '{{ template "email.default.html" . }}'
        headers:
          subject: '{{ template "email.default.subject" . }}'

  - name: 'staging-email'
    email_configs:
      - to: 'staging-ops@supplyforge.ai'
        send_resolved: true
        html: '{{ template "email.default.html" . }}'
        headers:
          subject: '{{ template "email.default.subject" . }}'

inhibit_rules:
  # MySQL Down suppresses MySQL Connection Saturation
  - source_matchers:
      - alertname="SupplyForgeMySQLDown"
    target_matchers:
      - alertname="SupplyForgeMySQLConnectionSaturation"

  # Redis Down suppresses Redis memory & eviction alerts and Cache errors
  - source_matchers:
      - alertname="SupplyForgeRedisDown"
    target_matchers:
      - alertname=~"SupplyForgeRedisMemoryHigh|SupplyForgeRedisEvictionsHigh|SupplyForgeCacheErrorRateHigh"

  # Backend Down suppresses API High Latency & API Error Rate alerts
  - source_matchers:
      - alertname="SupplyForgeBackendDown"
    target_matchers:
      - alertname=~"SupplyForgeAPIHighLatency|SupplyForgeAPIHighErrorRate"
