version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: supplyforge_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/recording-rules:/etc/prometheus/recording-rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - monitoring
      - supplyforge_net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: supplyforge_alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - monitoring
      - supplyforge_net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: supplyforge_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    networks:
      - monitoring
      - supplyforge_net

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: supplyforge_node_exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    networks:
      - monitoring
      - supplyforge_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: supplyforge_cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring
      - supplyforge_net

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: supplyforge_mysql_exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=${MYSQL_USER:-supplyforge}:${MYSQL_PASSWORD}@(mysql:3306)/${MYSQL_DATABASE:-supplyforge}
    networks:
      - monitoring
      - supplyforge_net

  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: supplyforge_redis_exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis:6379
    networks:
      - monitoring
      - supplyforge_net

  backend-mock:
    image: python:3.11-slim
    container_name: supplyforge_backend_mock
    command: sh -c "pip install prometheus_client && python /app/simulate_telemetry.py"
    volumes:
      - ./../scripts/simulate_telemetry.py:/app/simulate_telemetry.py:ro
    restart: unless-stopped
    networks:
      monitoring:
        aliases:
          - backend
      supplyforge_net:
        aliases:
          - backend

networks:
  monitoring:
    driver: bridge
  supplyforge_net:
    external: true
    name: supplyforge-ai_default

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
