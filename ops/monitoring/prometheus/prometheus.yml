global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: 'local'
    cluster: 'supplyforge-local'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "/etc/prometheus/rules/*.yml"
  - "/etc/prometheus/recording-rules/*.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          monitoring_required: 'true'

  # The local monitoring stack scrapes the backend directly. Production uses
  # its deployment-specific target file and never relies on this host address.
  - job_name: 'django-backend-local'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          monitoring_required: 'true'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          monitoring_required: 'false'

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          monitoring_required: 'false'

  - job_name: 'mysql'
    static_configs:
      - targets: ['mysqld-exporter:9104']
        labels:
          monitoring_required: 'false'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          monitoring_required: 'false'

  # Optional local data generator for validating dashboards without a running
  # Django instance. It is intentionally excluded from target-down alerts.
  - job_name: 'telemetry-simulator'
    static_configs:
      - targets: ['host.docker.internal:9108']
        labels:
          monitoring_required: 'false'
