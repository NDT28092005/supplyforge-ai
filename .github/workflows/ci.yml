name: SupplyForge CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  # 1. Phát hiện thay đổi (Path Filtering) để tối ưu chi phí và thời gian chạy
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Path Filter Check
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - 'src/**'
              - 'config/**'
              - 'contracts/**'
              - 'schemas/**'
              - 'models/**'
              - 'docker-compose.yml'
              - 'infra/**'
              - '.github/workflows/ci.yml'

  # 2. Pipeline kiểm thử Frontend (Angular)
  frontend-ci:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Compile and Build
        run: npm run build

      - name: Audit Production Dependencies
        run: npm audit --omit=dev --audit-level=high

  # 3. Pipeline kiểm thử Backend (Django)
  backend-ci:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: "ci-secret-key-for-django-testing"
      DEBUG: "True"
      USE_SQLITE: "1"
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Dependency Resolution
        run: pip check

      - name: Validate Django Configuration and Migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Run Django Tests
        run: python manage.py test supplyforge --verbosity 2

      - name: Verify Model Artifact Manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path('../models/model_manifest.json').read_text(encoding='utf-8'))
          for filename, expected in manifest['artifact_sha256'].items():
              actual = hashlib.sha256((Path('../models') / filename).read_bytes()).hexdigest()
              assert actual == expected, f'checksum mismatch: {filename}'
          PY

      - name: Build Image and Smoke-Test Packaged Model Runtime
        run: |
          docker build --tag supplyforge-ci:${{ github.sha }} -f Dockerfile ..
          docker run --rm supplyforge-ci:${{ github.sha }} python -c "from supplyforge.services.model_loader import ModelLoaderService; assert ModelLoaderService.runtime_status()['state'] == 'READY'"
