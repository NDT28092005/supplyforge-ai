user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $request_method $uri $status $body_bytes_sent $request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Coarse edge protection. The backend applies the tenant-aware rate limit
    # after authentication; this layer prevents a single IP exhausting proxy
    # connections before the request reaches Django.
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=upload_per_ip:10m rate=6r/m;
    limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
