<!-- ═══════════════════════════════════════════════════════════════════════ -->
<!-- FLOATING TRIGGER BUTTON                                                -->
<!-- ═══════════════════════════════════════════════════════════════════════ -->
<div class="fixed bottom-6 right-6 z-50">
  <button (click)="toggleWidget()" id="copilot-trigger-btn"
    class="relative group bg-indigo-600 hover:bg-indigo-700 text-white p-3.5 rounded-2xl shadow-lg hover:shadow-xl active:scale-95 transition-all duration-200 flex items-center gap-2.5 cursor-pointer border border-indigo-500/50"
    [ngClass]="isOpen ? 'scale-0 opacity-0 pointer-events-none' : 'scale-100 opacity-100'">
    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
    <span class="font-semibold text-sm pr-0.5 hidden sm:inline">Trợ lý</span>
  </button>
</div>

<!-- ═══════════════════════════════════════════════════════════════════════ -->
<!-- COPILOT PANEL                                                          -->
<!-- ═══════════════════════════════════════════════════════════════════════ -->
<div *ngIf="isOpen"
  class="fixed top-3 right-3 bottom-3 w-[400px] max-w-[calc(100vw-1.5rem)] z-50 bg-white border border-slate-200 shadow-2xl rounded-2xl flex flex-col overflow-hidden animate-slide-in">

  <!-- ─── HEADER ──────────────────────────────────────────────────── -->
  <div class="px-4 py-3.5 bg-white border-b border-slate-100 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white shrink-0 shadow-sm">
        <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
      </div>
      <div>
        <h3 class="font-bold text-slate-900 text-sm tracking-tight leading-tight">Trợ lý kho hàng</h3>
        <p class="text-[11px] text-slate-400 font-medium leading-tight mt-0.5">Hỏi bất cứ điều gì về tồn kho</p>
      </div>
    </div>

    <div class="flex items-center gap-1">
      <!-- New Chat -->
      <button *ngIf="!showWelcome" (click)="resetToWelcome()" title="Cuộc trò chuyện mới"
        class="w-8 h-8 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 flex items-center justify-center transition-all cursor-pointer">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
      <!-- Close -->
      <button (click)="toggleWidget()"
        class="w-8 h-8 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 flex items-center justify-center transition-all cursor-pointer">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- ─── BODY ────────────────────────────────────────────────────── -->
  <div #chatScrollContainer class="flex-1 overflow-y-auto custom-scrollbar">

    <!-- ═══ WELCOME STATE ═══ -->
    <div *ngIf="showWelcome" class="p-5 space-y-5">

      <!-- Welcome Text -->
      <div class="text-center pt-3 pb-1">
        <div class="w-12 h-12 rounded-2xl bg-indigo-50 mx-auto flex items-center justify-center mb-3">
          <svg class="w-6 h-6 text-indigo-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
        </div>
        <h4 class="text-slate-900 font-bold text-[15px]">Bạn cần hỗ trợ gì?</h4>
        <p class="text-slate-500 text-xs mt-1.5 leading-relaxed max-w-[260px] mx-auto">
          Chọn một chủ đề hoặc gõ câu hỏi bất kỳ về kho hàng của bạn.
        </p>
      </div>

      <!-- 4 Capability Cards with SVG Icons -->
      <div class="space-y-2">
        <button *ngFor="let card of capabilities" (click)="startFromCapability(card)"
          class="w-full text-left bg-white hover:bg-slate-50 border border-slate-200 hover:border-indigo-300 rounded-xl p-3.5 transition-all duration-150 group cursor-pointer active:scale-[0.99] shadow-xs hover:shadow-sm">
          <div class="flex items-start gap-3">
            <!-- SVG Icon -->
            <div class="w-9 h-9 rounded-lg bg-slate-50 group-hover:bg-indigo-50 flex items-center justify-center shrink-0 transition-colors">
              <svg class="w-[18px] h-[18px] text-slate-500 group-hover:text-indigo-600 transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path [attr.d]="card.svgIcon"></path>
              </svg>
            </div>
            <div class="min-w-0 flex-1">
              <div class="font-semibold text-slate-900 text-[13px] group-hover:text-indigo-700 transition-colors">{{ card.title }}</div>
              <div class="text-slate-500 text-[11px] mt-0.5 leading-relaxed">{{ card.desc }}</div>
            </div>
            <svg class="w-4 h-4 text-slate-300 group-hover:text-indigo-400 shrink-0 mt-1 transition-all group-hover:translate-x-0.5"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </div>
        </button>
      </div>

      <!-- Subtle hint -->
      <div class="flex items-center gap-2 px-1">
        <div class="w-1.5 h-1.5 rounded-full bg-emerald-500 shrink-0"></div>
        <span class="text-[11px] text-slate-400">Bạn cũng có thể nhập câu hỏi trực tiếp phía dưới</span>
      </div>
    </div>

    <!-- ═══ CHAT STATE ═══ -->
    <div *ngIf="!showWelcome" class="p-4 space-y-4">

      <div *ngFor="let msg of messages" class="animate-fade-in">

        <!-- USER MESSAGE -->
        <div *ngIf="msg.sender === 'user'" class="flex justify-end">
          <div class="bg-indigo-600 text-white rounded-2xl rounded-tr-md px-4 py-2.5 max-w-[85%] text-[13px] font-medium leading-relaxed shadow-sm">
            {{ msg.text }}
          </div>
        </div>

        <!-- AI MESSAGE -->
        <div *ngIf="msg.sender === 'ai'" class="flex items-start gap-2.5 max-w-[95%]">
          <div class="w-7 h-7 rounded-lg bg-indigo-50 flex items-center justify-center shrink-0 mt-0.5">
            <svg class="w-3.5 h-3.5 text-indigo-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
          </div>

          <div class="space-y-2 min-w-0 flex-1">
            <div class="bg-slate-50 border border-slate-100 text-slate-800 rounded-2xl rounded-tl-md p-3.5 text-[13px] leading-[1.7]"
              [innerHTML]="formatText(msg.text)">
            </div>

            <!-- Quick Actions -->
            <div *ngIf="msg.actions && msg.actions.length > 0" class="flex flex-wrap gap-1.5">
              <button *ngFor="let action of msg.actions" (click)="selectQuickAction(action)"
                class="inline-flex items-center gap-1.5 bg-white hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 text-slate-700 hover:text-indigo-700 rounded-lg px-3 py-1.5 text-[11px] font-semibold transition-all cursor-pointer active:scale-[0.98] shadow-xs">
                <svg class="w-3 h-3 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
                <span>{{ action.label }}</span>
              </button>
            </div>

            <div class="text-[10px] text-slate-400 pl-1">{{ msg.time }}</div>
          </div>
        </div>

      </div>

      <!-- AI Thinking -->
      <div *ngIf="isAiThinking" class="flex items-start gap-2.5">
        <div class="w-7 h-7 rounded-lg bg-indigo-50 flex items-center justify-center shrink-0">
          <svg class="w-3.5 h-3.5 text-indigo-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
        </div>
        <div class="bg-slate-50 border border-slate-100 rounded-2xl rounded-tl-md px-4 py-3 flex items-center gap-2">
          <div class="flex gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-slate-400 animate-bounce" style="animation-delay: 0ms"></span>
            <span class="w-1.5 h-1.5 rounded-full bg-slate-400 animate-bounce" style="animation-delay: 150ms"></span>
            <span class="w-1.5 h-1.5 rounded-full bg-slate-400 animate-bounce" style="animation-delay: 300ms"></span>
          </div>
          <span class="text-xs text-slate-400">Đang xem dữ liệu...</span>
        </div>
      </div>

    </div>
  </div>

  <!-- ─── FOOTER ──────────────────────────────────────────────────── -->
  <div class="p-3 bg-white border-t border-slate-100 shrink-0">
    <div class="flex items-end gap-2 bg-slate-50 border border-slate-200 rounded-xl p-2 focus-within:border-indigo-400 focus-within:bg-white transition-all">
      
      <textarea [(ngModel)]="userQueryText" (keydown)="handleKeydown($event)" rows="1"
        placeholder="Nhập câu hỏi..."
        class="w-full bg-transparent text-slate-900 text-[13px] font-medium outline-none resize-none px-2 py-1.5 placeholder:text-slate-400 custom-scrollbar leading-relaxed"></textarea>

      <button (click)="sendMessageFromInput()" [disabled]="!userQueryText || !userQueryText.trim()"
        class="p-2 rounded-lg transition-all flex items-center justify-center shrink-0 cursor-pointer active:scale-95"
        [ngClass]="(userQueryText && userQueryText.trim()) ? 'bg-indigo-600 hover:bg-indigo-700 text-white' : 'bg-slate-200 text-slate-400 cursor-not-allowed'">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

</div>
