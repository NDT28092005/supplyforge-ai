<aside class="w-64 bg-surface border-r border-border-base fixed inset-y-0 left-0 z-30 flex flex-col justify-between p-6 pt-24 transition-all">
  <div>
    <!-- Navigation Links -->
    <nav class="space-y-1.5">
      <button (click)="navigateTo('dashboard')" 
              class="w-full flex items-center gap-3.5 px-4 py-3 rounded-xl text-xs font-semibold transition-all text-left relative group overflow-hidden"
              [ngClass]="activeStage === 'dashboard' ? 'bg-accent/15 text-primary border border-accent/30' : 'text-secondary hover:bg-surface-hover hover:text-primary border border-transparent'">
        <!-- Active indicator line -->
        <span *ngIf="activeStage === 'dashboard'" class="absolute left-0 top-3 bottom-3 w-1 bg-accent rounded-r-md"></span>
        <svg class="w-4 h-4 transition-transform group-hover:scale-105" [ngClass]="activeStage === 'dashboard' ? 'text-accent' : 'text-secondary'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
        <span>Tổng quan Dòng tiền & Tồn kho</span>
      </button>

      <button (click)="navigateTo('aging')" 
              class="w-full flex items-center gap-3.5 px-4 py-3 rounded-xl text-xs font-semibold transition-all text-left relative group overflow-hidden"
              [ngClass]="activeStage === 'aging' ? 'bg-accent/15 text-primary border border-accent/30' : 'text-secondary hover:bg-surface-hover hover:text-primary border border-transparent'">
        <span *ngIf="activeStage === 'aging'" class="absolute left-0 top-3 bottom-3 w-1 bg-accent rounded-r-md"></span>
        <svg class="w-4 h-4 transition-transform group-hover:scale-105" [ngClass]="activeStage === 'aging' ? 'text-accent' : 'text-secondary'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span>Phân tích Tuổi hàng Tồn kho</span>
      </button>

      <button (click)="navigateTo('command-center')" 
              class="w-full flex items-center gap-3.5 px-4 py-3 rounded-xl text-xs font-semibold transition-all text-left relative group overflow-hidden"
              [ngClass]="activeStage === 'command-center' ? 'bg-accent/15 text-primary border border-accent/30' : 'text-secondary hover:bg-surface-hover hover:text-primary border border-transparent'">
        <span *ngIf="activeStage === 'command-center'" class="absolute left-0 top-3 bottom-3 w-1 bg-accent rounded-r-md"></span>
        <svg class="w-4 h-4 transition-transform group-hover:scale-105" [ngClass]="activeStage === 'command-center' ? 'text-accent' : 'text-secondary'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <circle cx="12" cy="12" r="4"></circle>
        </svg>
        <span>Trợ lý Thu hồi Vốn hàng loạt</span>
      </button>

      <button (click)="navigateTo('dedup')" 
              class="w-full flex items-center gap-3.5 px-4 py-3 rounded-xl text-xs font-semibold transition-all text-left relative group overflow-hidden"
              [ngClass]="activeStage === 'dedup' ? 'bg-accent/15 text-primary border border-accent/30' : 'text-secondary hover:bg-surface-hover hover:text-primary border border-transparent'">
        <span *ngIf="activeStage === 'dedup'" class="absolute left-0 top-3 bottom-3 w-1 bg-accent rounded-r-md"></span>
        <svg class="w-4 h-4 transition-transform group-hover:rotate-12" [ngClass]="activeStage === 'dedup' ? 'text-accent' : 'text-secondary'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
        <span>Rà soát Mã trùng lặp</span>
      </button>

      <button *ngIf="activeStage === 'recovery-copilot'"
              class="w-full flex items-center gap-3.5 px-4 py-3 rounded-xl text-xs font-semibold bg-accent/15 text-primary border border-accent/30 text-left relative overflow-hidden">
        <span class="absolute left-0 top-3 bottom-3 w-1 bg-accent rounded-r-md"></span>
        <svg class="w-4 h-4 text-accent animate-pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
        <span>Chi tiết Đề xuất Xả hàng</span>
      </button>
    </nav>
  </div>

  <!-- Footer Quick Action -->
  <div class="pt-5 border-t border-border-base space-y-4">
    <div class="bg-surface-hover p-4 rounded-xl border border-border-base">
      <div class="text-[9px] font-mono text-secondary uppercase tracking-widest font-semibold">Workspace</div>
      <div class="text-xs font-bold text-primary truncate mt-1">Demo E-com Store</div>
    </div>
    <button (click)="onImportNewClick()" class="w-full bg-red-50 text-danger border border-danger/30 hover:bg-danger hover:text-white px-4 py-3 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 active:scale-[0.98]">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </svg>
      <span>Import File Mới</span>
    </button>
  </div>
</aside>
