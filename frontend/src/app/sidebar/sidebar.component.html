<aside
  class="w-64 bg-surface border-r border-border-base fixed inset-y-0 left-0 z-30 flex flex-col justify-between p-6 pt-24 transition-all">
  <div>
    <!-- Navigation Links — 4 Tabs: "Tổng quan", "Rủi ro", "Đánh giá vốn", "Khuyến nghị xả hàng" -->
    <nav class="space-y-1.5">
      <!-- Tab 1: Tổng quan -->
      <a routerLink="/app/dashboard" routerLinkActive="bg-indigo-50 text-indigo-700 border-indigo-200 font-bold active-link"
        class="w-full flex items-center gap-3.5 px-4 py-3 rounded-xl text-xs font-semibold transition-all text-left relative group overflow-hidden cursor-pointer text-slate-600 hover:bg-slate-50 hover:text-slate-900 border border-transparent">
        <svg class="w-4 h-4 transition-transform group-hover:scale-105 text-slate-500" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1"></rect>
        </svg>
        <span>Tổng quan</span>
      </a>

      <!-- Tab 2: Rủi ro -->
      <a routerLink="/app/risk" routerLinkActive="bg-indigo-50 text-indigo-700 border-indigo-200 font-bold active-link"
        class="w-full flex items-center gap-3.5 px-4 py-3 rounded-xl text-xs font-semibold transition-all text-left relative group overflow-hidden cursor-pointer text-slate-600 hover:bg-slate-50 hover:text-slate-900 border border-transparent">
        <svg class="w-4 h-4 transition-transform group-hover:scale-105 text-slate-500"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <span>Rủi ro</span>
      </a>

      <!-- Tab 3: Đánh giá vốn -->
      <a routerLink="/app/capital" routerLinkActive="bg-indigo-50 text-indigo-700 border-indigo-200 font-bold active-link"
        class="w-full flex items-center gap-3.5 px-4 py-3 rounded-xl text-xs font-semibold transition-all text-left relative group overflow-hidden cursor-pointer text-slate-600 hover:bg-slate-50 hover:text-slate-900 border border-transparent">
        <svg class="w-4 h-4 transition-transform group-hover:scale-105 text-slate-500" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="1" x2="12" y2="23"></line>
          <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
        </svg>
        <span>Đánh giá vốn</span>
      </a>

      <!-- Tab 4: Khuyến nghị xả hàng -->
      <a routerLink="/app/decisions" routerLinkActive="bg-indigo-50 text-indigo-700 border-indigo-200 font-bold active-link"
        class="w-full flex items-center gap-3.5 px-4 py-3 rounded-xl text-xs font-semibold transition-all text-left relative group overflow-hidden cursor-pointer text-slate-600 hover:bg-slate-50 hover:text-slate-900 border border-transparent">
        <svg class="w-4 h-4 transition-transform group-hover:scale-105 text-slate-500" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <span>Khuyến nghị xả hàng</span>
      </a>

      <!-- Tab 5: Hàng chờ xử lý -->
      <a routerLink="/app/queue" routerLinkActive="bg-indigo-50 text-indigo-700 border-indigo-200 font-bold active-link"
        class="w-full flex items-center gap-3.5 px-4 py-3 rounded-xl text-xs font-semibold transition-all text-left relative group overflow-hidden cursor-pointer text-slate-600 hover:bg-slate-50 hover:text-slate-900 border border-transparent">
        <svg class="w-4 h-4 transition-transform group-hover:scale-105 text-slate-500" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line>
          <line x1="3" y1="6" x2="3.01" y2="6"></line>
          <line x1="3" y1="12" x2="3.01" y2="12"></line>
          <line x1="3" y1="18" x2="3.01" y2="18"></line>
        </svg>
        <span>Hàng chờ xử lý</span>
      </a>
    </nav>
  </div>

  <!-- Footer Quick Action -->
  <div class="pt-4 border-t border-border-base space-y-3">

    <!-- Incremental Import (Add Data) Button -->
    <button (click)="onImportIncrementalClick()"
      class="w-full bg-accent text-white hover:bg-blue-600 px-4 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 active:scale-[0.98] shadow-sm cursor-pointer">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      <span>Nhập Thêm Dữ Liệu</span>
    </button>

    <!-- Clear All Data & Import New Button -->
    <button (click)="onImportNewClick()"
      class="w-full bg-surface border border-red-500/30 text-red-400 hover:bg-red-500/10 px-4 py-2 rounded-xl text-[11px] font-mono transition-all flex items-center justify-center gap-1.5 active:scale-[0.98] cursor-pointer">
      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        <line x1="10" y1="11" x2="10" y2="17"></line>
        <line x1="14" y1="11" x2="14" y2="17"></line>
      </svg>
      <span>Xóa Toàn Bộ & Nhập Mới</span>
    </button>
  </div>
</aside>
