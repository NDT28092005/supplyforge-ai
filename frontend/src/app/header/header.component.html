<header class="bg-surface/90 backdrop-blur border-b border-border-base sticky top-0 z-40 px-6 py-3.5 flex items-center justify-between shadow-sm">
  <!-- Brand Header -->
  <div class="flex items-center gap-3 cursor-pointer select-none" (click)="onLogoClick()">
    <div class="w-9 h-9 rounded-xl bg-accent flex items-center justify-center text-white font-black text-lg shadow-material">
      <!-- Lightning Bolt SVG -->
      <svg class="w-5 h-5 text-white fill-current" viewBox="0 0 24 24">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
      </svg>
    </div>
    <div>
      <h1 class="font-tight font-black text-primary text-base tracking-tight leading-none">SupplyForge AI</h1>
      <span class="text-[9px] font-mono text-secondary uppercase tracking-widest block mt-0.5">Supply Chain OS · v1.0</span>
    </div>
  </div>

  <!-- Right Actions -->
  <div class="flex items-center gap-4">
    <!-- Unauthenticated State: Prominent Login Button -->
    <button *ngIf="!user" 
            (click)="onLoginClick()" 
            class="bg-accent text-white hover:bg-blue-600 px-5 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 active:scale-95">
      <svg class="w-3.5 h-3.5 stroke-current" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      <span>Đăng Nhập</span>
    </button>

    <!-- Authenticated State: User Profile -->
    <div *ngIf="user" class="flex items-center gap-3 bg-gray-50 border border-border-base px-3 py-1.5 rounded-xl">
      <div class="w-7 h-7 rounded-full bg-accent/10 text-accent font-bold text-xs flex items-center justify-center">
        {{ user.name ? user.name.charAt(0).toUpperCase() : 'U' }}
      </div>
      <div class="text-xs font-bold text-primary max-w-[120px] truncate">
        {{ user.name || user.email || 'User' }}
      </div>
      <button (click)="onLogoutClick()" 
              class="text-secondary hover:text-danger text-[11px] font-bold uppercase ml-2 transition-colors">
        Thoát
      </button>
    </div>
  </div>
</header>
