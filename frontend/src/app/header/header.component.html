<header
  class="bg-white/95 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-50 px-6 py-3.5 flex items-center justify-between shadow-xs font-sans">

  <!-- LEFT: Brand Logo & Title -->
  <div class="flex items-center gap-3 cursor-pointer select-none group" (click)="onLogoClick()">
    <!-- Prominent Custom Brand Logo Container -->
    <div
      class="h-12 px-2.5 py-1 rounded-2xl bg-white border border-slate-200/90 shadow-sm flex items-center justify-center transition-all group-hover:scale-105 group-hover:shadow-md group-hover:border-indigo-300">
      <img src="assets/logo.png" alt="SupplyForge Logo"
        class="h-full w-auto object-contain max-h-10 filter drop-shadow-xs" />
    </div>

    <div>
      <div class="flex items-center gap-1.5">
        <h1
          class="font-sans font-black text-slate-900 text-base tracking-tight leading-none group-hover:text-indigo-600 transition-colors">
          SupplyForge
        </h1>
      </div>
      <span class="text-[10px] font-sans text-slate-500 font-semibold block mt-0.5">
        Quản lý tồn kho &amp; dòng vốn
      </span>
    </div>
  </div>

  <!-- CENTER: Navigation & Info Links (About, Services, Blog) -->
  <div class="hidden md:flex items-center gap-1 sm:gap-2">
    <!-- Home button -->
    <button (click)="onNavigate('hero')"
      [ngClass]="stage === 'hero' ? 'bg-slate-100 text-slate-900 font-bold' : 'text-slate-600 hover:bg-slate-50 font-semibold'"
      class="px-3.5 py-1.5 rounded-xl text-xs transition-all cursor-pointer">
      Trang chủ
    </button>

    <!-- About Us Link -->
    <button (click)="onNavigate('about_us')"
      [ngClass]="stage === 'about_us' ? 'bg-slate-100 text-slate-900 font-bold' : 'text-slate-600 hover:bg-slate-50 font-semibold'"
      class="px-3.5 py-1.5 rounded-xl text-xs transition-all cursor-pointer">
      Giới thiệu
    </button>

    <!-- Services Link -->
    <button (click)="onNavigate('services')"
      [ngClass]="stage === 'services' ? 'bg-slate-100 text-slate-900 font-bold' : 'text-slate-600 hover:bg-slate-50 font-semibold'"
      class="px-3.5 py-1.5 rounded-xl text-xs transition-all cursor-pointer">
      Dịch vụ
    </button>

    <!-- Blog & Stock Knowledge Link -->
    <button (click)="onNavigate('blog')"
      [ngClass]="stage === 'blog' ? 'bg-indigo-50 text-indigo-700 font-bold border border-indigo-100' : 'text-slate-600 hover:text-indigo-600 hover:bg-indigo-50/60 font-semibold'"
      class="px-3.5 py-1.5 rounded-xl text-xs transition-all cursor-pointer flex items-center gap-1.5">
      <span class="w-1.5 h-1.5 rounded-full bg-indigo-600"></span>
      <span>Blog Kho Hàng</span>
    </button>
  </div>

  <!-- RIGHT: Login / User Profile & Actions -->
  <div class="flex items-center gap-3">

    <!-- UNAUTHENTICATED STATE -->
    <ng-container *ngIf="!user">
      <!-- Quick Demo Login Button -->
      <button (click)="onDemoLoginClick()" title="Đăng nhập dùng thử tài khoản Demo"
        class="hidden sm:flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 transition-all cursor-pointer">
        <svg class="w-3.5 h-3.5 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>Tài khoản Demo</span>
      </button>

      <!-- Main Login Button -->
      <button (click)="onLoginClick()"
        class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 active:scale-95 shadow-xs cursor-pointer">
        <svg class="w-3.5 h-3.5 stroke-current" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span>Đăng Nhập</span>
      </button>
    </ng-container>

    <!-- AUTHENTICATED STATE -->
    <ng-container *ngIf="user">
      <div class="flex items-center gap-3 bg-slate-50 border border-slate-200/80 px-3.5 py-1.5 rounded-2xl shadow-xs">
        <!-- User Avatar -->
        <div
          class="w-7 h-7 rounded-xl bg-indigo-100 text-indigo-700 font-bold text-xs flex items-center justify-center border border-indigo-200 font-mono shadow-2xs">
          {{ user.name ? user.name.charAt(0).toUpperCase() : 'U' }}
        </div>

        <!-- User Name & Role -->
        <div class="text-left hidden sm:block">
          <div class="text-xs font-bold text-slate-900 max-w-[130px] truncate leading-tight">
            {{ user.name || user.email || 'Chủ cửa hàng' }}
          </div>
          <div class="text-[10px] text-slate-500 font-medium leading-tight">
            {{ user.role || 'Quản trị viên' }}
          </div>
        </div>

        <!-- Logout Button -->
        <button (click)="onLogoutClick()" title="Đăng xuất khỏi tài khoản"
          class="text-slate-400 hover:text-rose-600 p-1.5 rounded-lg hover:bg-rose-50 transition-colors cursor-pointer ml-1">
          <svg class="w-4 h-4 stroke-current" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </ng-container>

  </div>

</header>
