<div class="min-h-screen bg-background flex flex-col items-center justify-center px-6">
  <div class="w-full max-w-md">
    <p class="text-xs font-mono text-secondary tracking-widest uppercase mb-12 text-center opacity-50">
      SupplyForge AI · Đang xử lý
    </p>

    <div class="w-full bg-surface border border-border-base rounded-full h-px mb-8 overflow-hidden">
      <div class="bg-accent h-px rounded-full transition-all duration-500" [style.width.%]="progress"></div>
    </div>

    <div class="space-y-3">
      <div *ngFor="let step of steps; let i = index"
           class="flex items-center gap-3 transition-all duration-500"
           [ngClass]="{ 'opacity-30': i < stepIndex, 'opacity-100': i === stepIndex, 'opacity-10': i > stepIndex }">
        <div class="w-1.5 h-1.5 rounded-full flex-shrink-0"
             [ngClass]="{ 'bg-primary': i < stepIndex, 'bg-accent': i === stepIndex, 'bg-border-base': i > stepIndex }">
        </div>
        <span class="text-sm font-mono" [ngClass]="{ 'text-primary': i === stepIndex, 'text-secondary': i !== stepIndex }">
          {{ step.label }}
          <span *ngIf="i === stepIndex" class="animate-blink text-accent ml-1">▋</span>
        </span>
      </div>
    </div>

    <div class="mt-10 text-right">
      <span class="font-tight font-black text-2xl tracking-tightest text-accent">
        {{ progress }}%
      </span>
    </div>
  </div>
</div>
