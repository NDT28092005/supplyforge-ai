server {
    listen 80;
    server_name _;

    # Keep request bodies bounded before they reach Django. The API applies
    # the same 500 MB limit as a defense-in-depth check.
    client_max_body_size 500m;
    client_body_timeout 300s;
    client_header_timeout 30s;
    large_client_header_buffers 4 16k;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; form-action 'self'" always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Angular build output is content-addressed. Cache it aggressively while
    # keeping the HTML shell on the normal short-lived path above.
    location ~* \.(?:css|js|mjs|woff2?|svg|png|jpe?g|gif|ico|webp)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=50 nodelay;
        limit_conn connections_per_ip 20;
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Large uploads are streamed to the backend instead of being buffered in
    # the Nginx worker's memory. Rate limiting is enforced atomically by the
    # Django/Redis API middleware.
    location = /api/v2/ingestion/upload {
        client_max_body_size 500m;
        limit_req zone=upload_per_ip burst=3 nodelay;
        limit_conn connections_per_ip 5;
        proxy_request_buffering off;
        proxy_pass http://backend:8080/api/v2/ingestion/upload;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location /health/ {
        proxy_pass http://backend:8080/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Security boundary: Block external access to Prometheus metrics endpoint
    location /metrics {
        return 403;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
