# Module 03 Risk Diagnostic Engine Rules Configuration (M3-05)
rules:
  D01:
    code: LOW_SALES_VELOCITY
    name: Low Sales Velocity
    severity: HIGH
    description: SKU exhibits extremely low historical 90-day sales velocity below 0.1 units/day.
    conditions:
      metric: sales_velocity_90d
      threshold: 0.1
      comparison: "<"

  D02:
    code: LUMPY_DEMAND
    name: Lumpy Demand Pattern
    severity: MEDIUM
    description: Demand pattern classified as Lumpy under Syntetos-Boylan criteria (ADI > 1.32, CV2 > 0.49).
    conditions:
      adi_threshold: 1.32
      cv2_threshold: 0.49

  D03:
    code: POSSIBLE_OBSOLESCENCE
    name: Possible Demand Obsolescence
    severity: HIGH
    description: SKU last sold over 180 days ago or predicted as CRITICAL risk level.
    conditions:
      dsls_threshold: 180
      risk_class_trigger: CRITICAL

  D04:
    code: PROMO_ASSOCIATED_LOW_VELOCITY
    name: Promotion Low Velocity Association
    severity: MEDIUM
    description: Promotion activity rate exceeds 20% while 90-day velocity remains below 0.5 units/day.
    conditions:
      promo_rate_threshold: 0.20
      velocity_threshold: 0.50

  D05:
    code: POSSIBLE_STOCKOUT_EFFECT
    name: Possible Stockout / Supply Disruption Pattern
    severity: MEDIUM
    description: Zero sales rate over 90 days exceeds 70% while SKU was active in the past 30 days.
    conditions:
      zero_rate_threshold: 0.70
      active_30d: true
