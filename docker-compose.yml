services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    stop_grace_period: 45s
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      USE_SQLITE: "0"
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_AUTH_MODE: ${S3_AUTH_MODE:-auto}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_LAKE_BUCKET: ${S3_LAKE_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_MULTIPART_PART_SIZE_BYTES: ${S3_MULTIPART_PART_SIZE_BYTES:-8388608}
      S3_PRESIGNED_UPLOAD_TTL_SECONDS: ${S3_PRESIGNED_UPLOAD_TTL_SECONDS:-900}
      SQS_INGESTION_QUEUE_URL: ${SQS_INGESTION_QUEUE_URL:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      GEMINI_ENABLED: ${GEMINI_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Run schema migrations once per release before web replicas start.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      USE_SQLITE: "0"
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_AUTH_MODE: ${S3_AUTH_MODE:-auto}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_LAKE_BUCKET: ${S3_LAKE_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_MULTIPART_PART_SIZE_BYTES: ${S3_MULTIPART_PART_SIZE_BYTES:-8388608}
      S3_PRESIGNED_UPLOAD_TTL_SECONDS: ${S3_PRESIGNED_UPLOAD_TTL_SECONDS:-900}
      SQS_INGESTION_QUEUE_URL: ${SQS_INGESTION_QUEUE_URL:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_data:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A config worker -l info -Q data_worker,celery -n data_worker@%h
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      APP_ENV: ${APP_ENV:-development}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      USE_SQLITE: "0"
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_AUTH_MODE: ${S3_AUTH_MODE:-auto}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_LAKE_BUCKET: ${S3_LAKE_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_MULTIPART_PART_SIZE_BYTES: ${S3_MULTIPART_PART_SIZE_BYTES:-8388608}
      S3_PRESIGNED_UPLOAD_TTL_SECONDS: ${S3_PRESIGNED_UPLOAD_TTL_SECONDS:-900}
      SQS_INGESTION_QUEUE_URL: ${SQS_INGESTION_QUEUE_URL:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  celery_ml:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A config worker -l info -Q ml_worker,celery -n ml_worker@%h
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      APP_ENV: ${APP_ENV:-development}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      USE_SQLITE: "0"
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_AUTH_MODE: ${S3_AUTH_MODE:-auto}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_LAKE_BUCKET: ${S3_LAKE_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_MULTIPART_PART_SIZE_BYTES: ${S3_MULTIPART_PART_SIZE_BYTES:-8388608}
      S3_PRESIGNED_UPLOAD_TTL_SECONDS: ${S3_PRESIGNED_UPLOAD_TTL_SECONDS:-900}
      SQS_INGESTION_QUEUE_URL: ${SQS_INGESTION_QUEUE_URL:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  celery_decision:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A config worker -l info -Q decision_worker,celery -n decision_worker@%h
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      APP_ENV: ${APP_ENV:-development}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      USE_SQLITE: "0"
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_AUTH_MODE: ${S3_AUTH_MODE:-auto}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_LAKE_BUCKET: ${S3_LAKE_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_MULTIPART_PART_SIZE_BYTES: ${S3_MULTIPART_PART_SIZE_BYTES:-8388608}
      S3_PRESIGNED_UPLOAD_TTL_SECONDS: ${S3_PRESIGNED_UPLOAD_TTL_SECONDS:-900}
      SQS_INGESTION_QUEUE_URL: ${SQS_INGESTION_QUEUE_URL:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      BACKEND_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8080}
      WORKSPACE_ID: ${NEXT_PUBLIC_WORKSPACE_ID:-1}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysqldata:
  redisdata:
