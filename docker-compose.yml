services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-supplyforge}
      MYSQL_USER: ${MYSQL_USER:-supplyforge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-supplyforge}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend:/app
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-supplyforge}
      MYSQL_USER: ${MYSQL_USER:-supplyforge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-supplyforge}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html
      - ./frontend/app.js:/usr/share/nginx/html/app.js
      - ./frontend/app.js.map:/usr/share/nginx/html/app.js.map
      - ./frontend/services:/usr/share/nginx/html/services
      - ./frontend/features:/usr/share/nginx/html/features
    environment:
      BACKEND_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      WORKSPACE_ID: ${NEXT_PUBLIC_WORKSPACE_ID:-1}
    depends_on:
      - backend

volumes:
  mysqldata:
