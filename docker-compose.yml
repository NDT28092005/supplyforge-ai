services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-supplyforge}
      MYSQL_USER: ${MYSQL_USER:-supplyforge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-supplyforge}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      APP_ENV: development
      USE_SQLITE: "0"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-supplyforge}
      MYSQL_USER: ${MYSQL_USER:-supplyforge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-supplyforge}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:80,http://127.0.0.1:3000
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  celery_data:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker -l info -Q data_worker,celery -n data_worker@%h
    restart: unless-stopped
    environment:
      APP_ENV: development
      USE_SQLITE: "0"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-supplyforge}
      MYSQL_USER: ${MYSQL_USER:-supplyforge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-supplyforge}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy

  celery_ml:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker -l info -Q ml_worker,celery -n ml_worker@%h
    restart: unless-stopped
    environment:
      APP_ENV: development
      USE_SQLITE: "0"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-supplyforge}
      MYSQL_USER: ${MYSQL_USER:-supplyforge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-supplyforge}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy

  celery_decision:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker -l info -Q decision_worker,celery -n decision_worker@%h
    restart: unless-stopped
    environment:
      APP_ENV: development
      USE_SQLITE: "0"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-supplyforge}
      MYSQL_USER: ${MYSQL_USER:-supplyforge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-supplyforge}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      BACKEND_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8080}
      WORKSPACE_ID: ${NEXT_PUBLIC_WORKSPACE_ID:-1}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysqldata:
  redisdata:
